name: Sync fork with upstream

on:
  schedule:
    - cron: "0 18 * * *"   # daily at 18:00 UTC = 2:00 AM Philippine time
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with rubibodadoo1313/wbb-website-redesign
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh repo sync cedie5472/wbb-website-redesign --branch main
